<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Pixel Physics Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="game" width="480" height="270" aria-label="Pixel Physics Lab"></canvas>

    <div id="boot" role="status" aria-live="assertive">
      <div class="boot-card">
        <div class="boot-title" data-role="title">PIXEL PHYSICS LAB</div>
        <div class="boot-message" data-role="message">STARTING…</div>
        <div class="boot-version">0.8.1</div>
      </div>
    </div>

    <div id="status" aria-live="polite"></div>
    <div id="context" hidden></div>
  </main>

  <script>
    (() => {
      const fail = (message) => {
        const boot = document.getElementById("boot");
        if (!boot) return;
        boot.hidden = false;
        boot.classList.add("fatal");
        const title = boot.querySelector("[data-role=title]");
        const msg = boot.querySelector("[data-role=message]");
        if (title) title.textContent = "STARTUP ERROR";
        if (msg) msg.textContent = String(message || "Unknown startup error").slice(0, 420);
        try { window.AndroidBridge?.log?.("error", "BOOT_FATAL " + String(message)); } catch {}
      };
      window.addEventListener("error", e => fail(e.message || e.error));
      window.addEventListener("unhandledrejection", e => fail(e.reason?.stack || e.reason));
    })();
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
