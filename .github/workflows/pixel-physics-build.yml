name: Pixel Physics Native 2.5D Build
on:
  push:
    branches:
      - pixel-physics-25d-native-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Build native Android APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PixelPhysicsSandbox-Native25D.apk
      - name: Verify APK has no game-engine native libraries
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PixelPhysicsSandbox-Native25D.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging PixelPhysicsSandbox-Native25D.apk | head -40
          unzip -t PixelPhysicsSandbox-Native25D.apk
          ! unzip -l PixelPhysicsSandbox-Native25D.apk | grep -qE "libgdx|libgdx-box2d|libgdx-bullet"
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-native-25d-apk
          path: PixelPhysicsSandbox-Native25D.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pixel-physics-native-25d-apk
          path: .
      - name: Android 16 launch and process survival
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r PixelPhysicsSandbox-Native25D.apk
            adb logcat -c
            adb shell am force-stop com.pixelphysics.sandbox
            adb shell am start -W -n com.pixelphysics.sandbox/.AndroidLauncher
            sleep 15
            adb shell pidof com.pixelphysics.sandbox
            ! adb logcat -d -b crash | grep -q "com.pixelphysics.sandbox"
