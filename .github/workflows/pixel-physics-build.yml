name: Pixel Physics Isometric 2.5D Build
on:
  push:
    branches:
      - pixel-physics-pure-2d
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build isometric 2.5D APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PixelPhysicsSandbox-Isometric25D.apk
      - name: Verify isometric 2.5D APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PixelPhysicsSandbox-Isometric25D.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging PixelPhysicsSandbox-Isometric25D.apk | head -40
          unzip -t PixelPhysicsSandbox-Isometric25D.apk
          unzip -l PixelPhysicsSandbox-Isometric25D.apk | grep -q "lib/arm64-v8a/libgdx.so"
          unzip -l PixelPhysicsSandbox-Isometric25D.apk | grep -q "lib/arm64-v8a/libgdx-box2d.so"
          unzip -l PixelPhysicsSandbox-Isometric25D.apk | grep -q "lib/x86_64/libgdx.so"
          unzip -l PixelPhysicsSandbox-Isometric25D.apk | grep -q "lib/x86_64/libgdx-box2d.so"
          ! unzip -l PixelPhysicsSandbox-Isometric25D.apk | grep -q "libgdx-bullet.so"
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-isometric-25d-apk
          path: PixelPhysicsSandbox-Isometric25D.apk
          if-no-files-found: error
