name: Pixel Physics Android Build
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PixelPhysicsSandbox-MVP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-apk
          path: PixelPhysicsSandbox-MVP.apk
          if-no-files-found: error
