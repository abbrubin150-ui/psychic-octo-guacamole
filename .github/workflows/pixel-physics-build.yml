name: Voxel Dynamics v8.1

concurrency:
  group: voxel-dynamics-v81-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - pixel-physics-enterprise-v8
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned web dependencies
        run: npm install --prefix web --ignore-scripts --no-audit --no-fund

      - name: Run v8 contract tests
        run: npm test --prefix web

      - name: Build local offline runtime
        run: npm run build --prefix web

      - name: Verify generated runtime
        run: |
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/style.css
          test -s app/src/main/assets/www/game.js
          test -s app/src/main/assets/www/rapier_wasm3d_bg.wasm
          grep -q "VOXEL DYNAMICS" app/src/main/assets/www/index.html
          grep -q 'type="module"' app/src/main/assets/www/index.html
          grep -q "rapier_wasm3d_bg.wasm" app/src/main/assets/www/game.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Run Android unit tests
        run: gradle --stacktrace :app:testDebugUnitTest

      - name: Build Voxel Dynamics APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoxelDynamics-v8.1.apk

      - name: Verify signed self-contained APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs VoxelDynamics-v8.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging VoxelDynamics-v8.1.apk | head -40
          unzip -t VoxelDynamics-v8.1.apk
          unzip -l VoxelDynamics-v8.1.apk | grep -q "assets/www/game.js"
          unzip -l VoxelDynamics-v8.1.apk | grep -q "assets/www/index.html"
          unzip -l VoxelDynamics-v8.1.apk | grep -q "assets/www/rapier_wasm3d_bg.wasm"

      - uses: actions/upload-artifact@v4
        with:
          name: voxel-dynamics-v81-apk
          path: VoxelDynamics-v8.1.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voxel-dynamics-v81-apk
          path: .

      - name: Android 16 APP_READY and interaction soak
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-smoke-v8.sh VoxelDynamics-v8.1.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-dynamics-v81-smoke
          path: |
            voxel-dynamics-v81-smoke.png
            voxel-dynamics-v81-metrics.txt
          if-no-files-found: ignore
