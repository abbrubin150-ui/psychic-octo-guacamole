name: Pixel Physics Voxel Physics v7

on:
  push:
    branches:
      - pixel-physics-voxel-physics-v7
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build voxel ortho APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PixelPhysicsSandbox-Physics-v7.apk
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PixelPhysicsSandbox-Physics-v7.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging PixelPhysicsSandbox-Physics-v7.apk | head -40
          unzip -t PixelPhysicsSandbox-Physics-v7.apk
          ! unzip -l PixelPhysicsSandbox-Physics-v7.apk | grep -E -q "lib/.*\.so$"
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-voxel-physics-v7-apk
          path: PixelPhysicsSandbox-Physics-v7.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pixel-physics-voxel-physics-v7-apk
          path: .
      - name: Android 16 launch and crash check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r PixelPhysicsSandbox-Physics-v7.apk
            adb logcat -c
            adb shell am force-stop com.pixelphysics.sandbox
            adb shell am start -W -n com.pixelphysics.sandbox/.AndroidLauncher
            sleep 12
            PID="$(adb shell pidof com.pixelphysics.sandbox | tr -d '\r')"
            echo "PID=$PID"
            if [ -z "$PID" ]; then
              adb logcat -d -b crash || true
              adb logcat -d -v threadtime | tail -500 || true
              exit 1
            fi
            if adb logcat -d -b crash | grep -q "com.pixelphysics.sandbox"; then
              adb logcat -d -b crash
              exit 1
            fi
            adb exec-out screencap -p > physics-v7-smoke.png
            test -s physics-v7-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-physics-voxel-physics-v7-smoke
          path: physics-v7-smoke.png
          if-no-files-found: ignore
