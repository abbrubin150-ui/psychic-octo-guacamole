name: Pixel Physics Android Build
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PixelPhysicsSandbox-MVP.apk
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs PixelPhysicsSandbox-MVP.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging PixelPhysicsSandbox-MVP.apk | head -40
          unzip -t PixelPhysicsSandbox-MVP.apk
      - name: Install Android 15 emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pixelphysics -k "system-images;android-35;google_apis;x86_64" --force
      - name: Emulator smoke test
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd pixelphysics -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r PixelPhysicsSandbox-MVP.apk
          adb logcat -c
          adb shell am start -W -n com.pixelphysics.sandbox/.AndroidLauncher
          sleep 8
          PID="$(adb shell pidof com.pixelphysics.sandbox | tr -d '\r')"
          test -n "$PID"
          if adb logcat -d -b crash | grep -q "com.pixelphysics.sandbox"; then
            adb logcat -d -b crash
            exit 1
          fi
          adb exec-out screencap -p > pixel-physics-smoke.png
          test -s pixel-physics-smoke.png
          echo "Smoke test process PID: $PID"
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-apk
          path: |
            PixelPhysicsSandbox-MVP.apk
            pixel-physics-smoke.png
          if-no-files-found: error
