plugins { id 'com.android.application' }

android {
    namespace 'com.pixelphysics.sandbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pixelphysics.sandbox'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.0-isometric-25d-canvas'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
}
